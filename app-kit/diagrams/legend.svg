<svg xmlns="http://www.w3.org/2000/svg" width="676" height="182" viewBox="0 0 676 182" role="img" font-family="Lato, Arial, Helvetica, sans-serif"><title>Workflow diagram key</title><rect width="676" height="182" fill="#FFFFFF"/>
<line x1="12" y1="12" x2="664" y2="12" stroke="#D5DACB"/>
<rect x="12.0" y="26" width="30" height="20" rx="5" fill="#20494F" stroke="#20494F" stroke-width="1.3"/>
<text x="50.0" y="36" dominant-baseline="central" font-size="12" fill="#1F1F1F"><tspan font-weight="600">Start</tspan><tspan fill="#55605F">: what starts the flow</tspan></text>
<rect x="338.0" y="26" width="30" height="20" rx="2" fill="#FFFFFF" stroke="#306B74" stroke-width="1.3"/>
<text x="376.0" y="36" dominant-baseline="central" font-size="12" fill="#1F1F1F"><tspan font-weight="600">System step</tspan><tspan fill="#55605F">: a system does something</tspan></text>
<polygon points="17.0,56 37.0,56 42.0,66 37.0,76 17.0,76 12.0,66" fill="#FFFFFF" stroke="#20494F" stroke-width="1.3"/>
<text x="50.0" y="66" dominant-baseline="central" font-size="12" fill="#1F1F1F"><tspan font-weight="600">Person step</tspan><tspan fill="#55605F">: a person must act</tspan></text>
<rect x="338.0" y="56" width="30" height="20" rx="10" fill="#F5F7F0" stroke="#9AA77E" stroke-width="1.3"/>
<text x="376.0" y="66" dominant-baseline="central" font-size="12" fill="#1F1F1F"><tspan font-weight="600">Wait for</tspan><tspan fill="#55605F">: waits for something, with a time-out</tspan></text>
<rect x="12.0" y="86" width="30" height="20" rx="10" fill="#F5F7F0" stroke="#9AA77E" stroke-width="1.3" stroke-dasharray="5 3"/>
<text x="50.0" y="96" dominant-baseline="central" font-size="12" fill="#1F1F1F"><tspan font-weight="600">Wait</tspan><tspan fill="#55605F">: waits a fixed time</tspan></text>
<polygon points="353.0,86 368.0,96 353.0,106 338.0,96" fill="#C6D1AE" stroke="#306B74" stroke-width="1.3"/>
<text x="376.0" y="96" dominant-baseline="central" font-size="12" fill="#1F1F1F"><tspan font-weight="600">Choice</tspan><tspan fill="#55605F">: a choice; each way out is labelled</tspan></text>
<rect x="12.0" y="116" width="30" height="20" rx="2" fill="#FFFFFF" stroke="#306B74" stroke-width="1.3"/>
<rect x="15.0" y="119" width="24" height="14" rx="1" fill="none" stroke="#306B74"/>
<text x="50.0" y="126" dominant-baseline="central" font-size="12" fill="#1F1F1F"><tspan font-weight="600">Another flow</tspan><tspan fill="#55605F">: hands over to another flow</tspan></text>
<circle cx="353.0" cy="126" r="8" fill="#E8F0EF" stroke="#306B74" stroke-width="1.3"/>
<text x="376.0" y="126" dominant-baseline="central" font-size="12" fill="#1F1F1F"><tspan font-weight="600">Stops early</tspan><tspan fill="#55605F">: leaves the flow early</tspan></text>
<circle cx="27.0" cy="156" r="8" fill="#FFFFFF" stroke="#8C9488" stroke-width="1.3"/>
<text x="50.0" y="156" dominant-baseline="central" font-size="12" fill="#1F1F1F"><tspan font-weight="600">End</tspan><tspan fill="#55605F">: the normal end</tspan></text>
<rect x="338.0" y="146" width="30" height="20" rx="2" fill="#FFF4E5" stroke="#8A4B00" stroke-width="1.3" stroke-dasharray="4 3"/>
<text x="376.0" y="156" dominant-baseline="central" font-size="12" fill="#1F1F1F"><tspan font-weight="600">To do</tspan><tspan fill="#55605F">: missing, broken or still to do</tspan></text>
</svg>
